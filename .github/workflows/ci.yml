name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: pm
          POSTGRES_DB: pm_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm -d pm_research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
      - run: pip install -r requirements-core.txt -r requirements-dev.txt
      - run: alembic upgrade head
      - run: >-
          pytest -q
          --ignore=tests/test_kalshi_live.py
          --ignore=tests/test_polymarket_live.py
          --ignore=tests/quick_test_apis.py
